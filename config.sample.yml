llm:
  provider: ""  # one of: openwebui, ollama, openai, claude, anthropic, openrouter, legacy_generate
  model: ""
  base_url: ""
  api_key: ""
  timeout_seconds: null  # null or 0 disables HTTP timeout for slow local models
  max_tokens: 2048
  temperature: 0.2
  anthropic_version: "2023-06-01"  # only used for claude/anthropic
  site_url: ""  # optional, used by openrouter
  site_name: ""  # optional, used by openrouter

whisper_model: "tiny"  # see the Dockerfile; WhisperX ASR models preloaded during build are tiny, base, and small
worker_count: 2  # number of background processing workers; on GPU, 1 is usually the safe default
format_transcripts: true  # format audio/video transcripts into readable markdown before saving and summarizing
transcript_format_prompt_path: "/app/format-transcript.md"  # optional; built-in prompt is used if this file does not exist
summary_prompt_path: "/app/summarize-notes.md"  # optional; defaults to /app/summarize-notes.md
vault_path: "/app/vault"  # folder inside your Obsidian vault where audio artifacts and notes are copied
obsidian_template_path: "/app/obsidian-template.md"  # optional; defaults to a template next to summarize-notes.md or a built-in plain template

chunking:
  enabled: true
  max_input_chars: 24000  # if input exceeds this, EchoNotes summarizes it in chunks first
  target_chunk_chars: 16000
  overlap_chars: 400

