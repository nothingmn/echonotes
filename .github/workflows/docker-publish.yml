name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/echonotes

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: cpu
            image_variant: cpu
            image_suffix: ""
            gpu_alias: false
            gpu_base_image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
            gpu_cuda_devel_image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
            torch_index_url: https://pypi.org/simple
            torch_extra_index_url: https://download.pytorch.org/whl/cpu
            torch_package_spec: torch==2.8.0+cpu
            torchaudio_package_spec: torchaudio==2.8.0+cpu
            torch_install_no_deps: "0"
            torch_python_deps: ""
          - variant_name: cuda12.8
            image_variant: gpu
            image_suffix: -cuda12.8
            gpu_alias: true
            gpu_base_image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
            gpu_cuda_devel_image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
            torch_index_url: https://download.pytorch.org/whl/cu128
            torch_extra_index_url: ""
            torch_package_spec: torch==2.8.0
            torchaudio_package_spec: torchaudio==2.8.0
            torch_install_no_deps: "1"
            torch_python_deps: filelock,fsspec,jinja2,markupsafe,mpmath,networkx,sympy,typing-extensions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          tags=("${IMAGE_NAME}:latest${{ matrix.image_suffix }}")
          if [[ "${{ matrix.gpu_alias }}" == "true" ]]; then
            tags+=("${IMAGE_NAME}:gpu")
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("${IMAGE_NAME}:${version}${{ matrix.image_suffix }}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.variant_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_VARIANT=${{ matrix.image_variant }}
            GPU_BASE_IMAGE=${{ matrix.gpu_base_image }}
            GPU_CUDA_DEVEL_IMAGE=${{ matrix.gpu_cuda_devel_image }}
            TORCH_INDEX_URL=${{ matrix.torch_index_url }}
            TORCH_EXTRA_INDEX_URL=${{ matrix.torch_extra_index_url }}
            TORCH_PACKAGE_SPEC=${{ matrix.torch_package_spec }}
            TORCHAUDIO_PACKAGE_SPEC=${{ matrix.torchaudio_package_spec }}
            TORCH_INSTALL_NO_DEPS=${{ matrix.torch_install_no_deps }}
            TORCH_PYTHON_DEPS=${{ matrix.torch_python_deps }}
