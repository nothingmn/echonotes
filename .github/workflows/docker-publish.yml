name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/echonotes

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: cpu
            image_variant: cpu
            image_suffix: ""
            gpu_alias: false
            gpu_base_image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
            torch_index_url: https://pypi.org/simple
            torch_extra_index_url: https://download.pytorch.org/whl/cpu
            torch_package_spec: torch==2.8.0+cpu
            torchaudio_package_spec: torchaudio==2.8.0+cpu
            torch_install_no_deps: "0"
            torch_python_deps: ""
          - variant_name: cuda12.8
            image_variant: gpu
            image_suffix: -cuda12.8
            gpu_alias: true
            gpu_base_image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
            torch_index_url: https://download.pytorch.org/whl/cu128
            torch_extra_index_url: ""
            torch_package_spec: torch==2.8.0
            torchaudio_package_spec: torchaudio==2.8.0
            torch_install_no_deps: "1"
            torch_python_deps: filelock,fsspec,jinja2,markupsafe,mpmath,networkx,sympy,typing-extensions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          tags=("${IMAGE_NAME}:latest${{ matrix.image_suffix }}")
          if [[ "${{ matrix.gpu_alias }}" == "true" ]]; then
            tags+=("${IMAGE_NAME}:gpu")
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("${IMAGE_NAME}:${version}${{ matrix.image_suffix }}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.variant_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_VARIANT=${{ matrix.image_variant }}
            GPU_BASE_IMAGE=${{ matrix.gpu_base_image }}
            TORCH_INDEX_URL=${{ matrix.torch_index_url }}
            TORCH_EXTRA_INDEX_URL=${{ matrix.torch_extra_index_url }}
            TORCH_PACKAGE_SPEC=${{ matrix.torch_package_spec }}
            TORCHAUDIO_PACKAGE_SPEC=${{ matrix.torchaudio_package_spec }}
            TORCH_INSTALL_NO_DEPS=${{ matrix.torch_install_no_deps }}
            TORCH_PYTHON_DEPS=${{ matrix.torch_python_deps }}

  create-release:
    if: github.ref_type == 'tag'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets

          cp README.md dist/release-assets/
          cp config.sample.yml dist/release-assets/
          cp summarize-notes.md dist/release-assets/
          cp build.sh dist/release-assets/
          cp run.sh dist/release-assets/
          cp Dockerfile dist/release-assets/

          if [[ -f "releases/${VERSION}.md" ]]; then
            cp "releases/${VERSION}.md" dist/release-notes.md
          else
            {
              printf '# EchoNotes %s\n\n' "${VERSION}"
              printf 'Docker images:\n\n'
              printf -- '- %s:%s\n' "${IMAGE_NAME}" "${VERSION#v}"
              printf -- '- %s:%s-cuda12.8\n' "${IMAGE_NAME}" "${VERSION#v}"
              printf -- '- %s:latest\n' "${IMAGE_NAME}"
              printf -- '- %s:latest-cuda12.8\n' "${IMAGE_NAME}"
              printf -- '- %s:gpu\n' "${IMAGE_NAME}"
            } > dist/release-notes.md
          fi

          {
            printf '%s:%s\n' "${IMAGE_NAME}" "${VERSION#v}"
            printf '%s:%s-cuda12.8\n' "${IMAGE_NAME}" "${VERSION#v}"
            printf '%s:latest\n' "${IMAGE_NAME}"
            printf '%s:latest-cuda12.8\n' "${IMAGE_NAME}"
            printf '%s:gpu\n' "${IMAGE_NAME}"
          } > "dist/docker-images-${VERSION}.txt"

          python3 - <<PY
          import hashlib
          import pathlib
          import zipfile

          version = "${VERSION}"
          asset_dir = pathlib.Path("dist/release-assets")
          zip_path = pathlib.Path(f"dist/echonotes-{version}-assets.zip")
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(asset_dir.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(asset_dir))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          pathlib.Path(f"dist/echonotes-{version}-assets.sha256").write_text(
              f"{digest}  {zip_path.name}\n"
          )
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/echonotes-${{ github.ref_name }}-assets.zip
            dist/echonotes-${{ github.ref_name }}-assets.sha256
            dist/docker-images-${{ github.ref_name }}.txt
